<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习打卡">
<meta name="theme-color" content="#FFFBF5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FDE7EC'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<title>婉欣的学习打卡</title>
<style>
:root{
  --bg:#FFFBF5; --card:#FFFFFF; --card2:#FFF6F0; --rail:#FBEADF;
  --pink:#F6A6B8; --pink2:#F48CA4; --pinksoft:#FDE7EC;
  --ink:#4A4038; --dim:#9C8F86; --line:#F1E5DC;
  --green:#8FCB9B; --greensoft:#EAF7EC; --gold:#E7B84B;
  --shadow:0 2px 10px rgba(180,140,120,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:17px; line-height:1.55; min-height:100vh;
  -webkit-user-select:none; user-select:none;
}
.app{display:flex; align-items:flex-start}
.rail{width:88px; flex:0 0 88px; background:var(--rail); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:calc(10px + env(safe-area-inset-top)) 7px calc(16px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:6px}
.rail .rlogo{font-size:24px; text-align:center; margin-bottom:4px}
.rail button{border:0; background:transparent; border-radius:14px; padding:9px 3px; min-height:58px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:11.5px; font-weight:800; color:#A98E80; cursor:pointer; transition:.15s}
.rail button .e{font-size:22px; line-height:1}
.rail button.on{background:#fff; color:var(--pink2); box-shadow:var(--shadow)}
.rail button .cnt2{font-size:10px; font-weight:700; color:var(--dim)}
.rail button.on .cnt2{color:var(--pink2)}
.main{flex:1; min-width:0; padding:calc(12px + env(safe-area-inset-top)) 12px calc(26px + env(safe-area-inset-bottom))}
.inner{max-width:560px; margin:0 auto}
h1{font-size:20px; font-weight:800; letter-spacing:.3px}
.hrowtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.snd{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:7px 13px;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;min-height:42px}
.head{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:15px; box-shadow:var(--shadow)}
.head .date{font-size:14px; color:var(--dim); font-weight:600; margin-top:3px}
.pbar{height:14px; border-radius:99px; background:var(--pinksoft); overflow:hidden; margin-top:13px; border:1px solid var(--line)}
.pbar>i{display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#F7B7C5,#F48CA4); transition:width .35s ease}
.ptxt{display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; font-size:14px; color:var(--dim); font-weight:700}
.ptxt b{font-size:19px; color:var(--pink2)}
.pills{display:flex; gap:8px; margin-top:12px}
.pill{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:9px 6px; text-align:center}
.pill b{display:block; font-size:19px; font-weight:800; color:var(--pink2)}
.pill span{font-size:11.5px; color:var(--dim); font-weight:700}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-top:12px; box-shadow:var(--shadow)}
h2{font-size:16.5px; font-weight:800; margin:18px 4px 8px; display:flex; align-items:center; gap:7px}
h2 .tip{font-size:12.5px; color:var(--dim); font-weight:600}
.muted{color:var(--dim); font-size:13.5px; font-weight:600; line-height:1.7}
.timecard{margin-top:12px}
.timecard .tline{display:flex; gap:10px; align-items:flex-start; padding:7px 10px; border-radius:12px; font-size:15px; font-weight:700}
.timecard .tline b{color:var(--pink2); font-weight:800; min-width:56px; font-variant-numeric:tabular-nums}
.timecard .tline.on{background:var(--pinksoft)}
.nowline{font-size:13px; color:var(--dim); font-weight:700; margin-top:6px; padding-left:10px}
details.pri{margin-top:12px}
details.pri summary{cursor:pointer; font-size:15px; font-weight:800; list-style:none}
details.pri summary::-webkit-details-marker{display:none}
details.pri .row{display:flex; gap:9px; padding:7px 2px 0; font-size:14px; align-items:flex-start}
.lab{flex:0 0 auto; font-weight:800; border-radius:9px; padding:2px 9px; font-size:12.5px}
.lab.high{background:#FDECEF; color:#D5546E}
.lab.next{background:#FEF4E6; color:#C08A2A}
.lab.reduce{background:var(--greensoft); color:#54885F}
/* 任务组 */
.grp{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:6px 6px; box-shadow:var(--shadow)}
.task{display:flex; align-items:center; gap:11px; padding:11px 10px; border-radius:14px; min-height:52px}
.task+.task{border-top:1px dashed var(--line)}
.task .ck{width:30px; height:30px; flex:0 0 auto; border-radius:10px; border:2px solid #E4D2C8; background:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff; cursor:pointer; transition:.15s}
.task.done .ck{background:var(--green); border-color:var(--green)}
.task.done .nm{color:#8AA891; text-decoration:line-through}
.task .mid{flex:1; min-width:0}
.task .nm{font-size:16px; font-weight:700}
.task .sub{font-size:12.5px; color:var(--dim); font-weight:600; margin-top:2px}
.badge{display:inline-block; font-size:11.5px; font-weight:800; border-radius:8px; padding:1px 7px; margin-left:6px; vertical-align:1px}
.badge.high{background:#FDECEF; color:#D5546E}
.badge.next{background:#FEF4E6; color:#C08A2A}
.badge.reduce{background:var(--greensoft); color:#54885F}
.rbtn{flex:0 0 auto; border:1px solid var(--line); background:var(--card2); color:var(--pink2); border-radius:12px; padding:9px 12px; font-size:14px; font-weight:800; cursor:pointer; min-height:44px}
.rbtn:active{transform:scale(.96)}
.rbtn.on{background:var(--pink2); color:#fff; border-color:var(--pink2)}
/* 日程 */
.sched-head{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.sched-head .now{font-size:15px;font-weight:800}
.sched-head .now b{color:var(--pink2)}
.blk{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-top:10px; box-shadow:var(--shadow)}
.blk.cur{border-color:var(--pink2); box-shadow:0 0 0 2px var(--pinksoft), var(--shadow)}
.blk.past{opacity:.7}
.bhd{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.bt{font-size:12.5px; font-weight:800; color:var(--pink2); background:var(--pinksoft); border-radius:8px; padding:2px 8px; font-variant-numeric:tabular-nums; white-space:nowrap}
.bnm{font-size:15.5px; font-weight:800; flex:1; min-width:120px}
.bai{font-size:13px; color:var(--dim); font-weight:600; margin-top:6px; line-height:1.6}
.bai .ailab{color:var(--pink2); font-weight:800}
.blk .tasks{margin-top:6px}
.blk .task{padding:7px 2px; min-height:42px}
.blk .task+.task{border-top:1px dashed var(--line)}
.blk .task .ck{width:26px;height:26px;font-size:15px;border-radius:9px}
.blk .task .nm{font-size:15px}
.acts2{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.acts2 button{flex:1; min-width:88px; border:1px solid var(--line); background:var(--card2); color:var(--ink); border-radius:12px; padding:10px 8px; font-size:13.5px; font-weight:800; cursor:pointer; min-height:44px; font-variant-numeric:tabular-nums}
.acts2 button.on{background:var(--pink2); color:#fff; border-color:var(--pink2)}
.acts2 button:active{transform:scale(.97)}
.badd{font-size:13px; font-weight:700; margin-top:8px}
.badd.ok{color:#54885F}
.badd.bad{color:#D5546E}
/* 宠物 */
.petcard{text-align:center}
.petface{font-size:66px; line-height:1.1}
.petname{font-size:17px; font-weight:800; margin-top:4px}
.petlv{display:inline-block; margin-top:6px; background:var(--pinksoft); color:#D5546E; font-size:13px; font-weight:800; border-radius:99px; padding:3px 12px}
.petstats{display:flex; gap:8px; margin-top:12px}
.pstat{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:10px 6px}
.pstat b{display:block; font-size:19px; font-weight:800; color:var(--pink2)}
.pstat span{font-size:12px; color:var(--dim); font-weight:700}
.happy{margin-top:12px; text-align:left; font-size:13px; font-weight:700; color:var(--ink)}
.happy .bar{height:11px; border-radius:99px; background:#F6E9EE; overflow:hidden; margin-top:5px; border:1px solid var(--line)}
.happy .bar>i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#F9C6D2,#F48CA4)}
.acts{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.acts button{flex:1; min-width:96px; border:1px solid var(--line); background:var(--card2); color:var(--ink); border-radius:14px; padding:12px 8px; font-size:14px; font-weight:800; cursor:pointer; min-height:48px}
.acts button .c{color:var(--gold); font-size:12.5px}
.acts button:disabled{opacity:.45}
.acts button:active{transform:scale(.97)}
.next-lv{font-size:12.5px; color:var(--dim); font-weight:600; margin-top:10px}
/* 列表 */
.lrow{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; font-weight:600; padding:8px 4px; border-bottom:1px dashed var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .r{color:var(--dim); font-weight:700; white-space:nowrap}
.hrow{font-size:13.5px; font-weight:600; padding:9px 4px; border-bottom:1px dashed var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{font-weight:800}
.hrow .rf{color:var(--dim); font-size:12.5px; margin-top:2px}
.up{color:#54885F; font-weight:800}
.dn{color:#D5546E; font-weight:800}
.sum{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.sum .b{flex:1; min-width:88px; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center}
.sum .b b{display:block; font-size:20px; font-weight:800; color:var(--pink2)}
.sum .b span{font-size:12px; color:var(--dim); font-weight:700}
.pd-row{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; padding:6px 2px}
.pd-row .rd{flex:0 0 78px; color:var(--ink)}
.pd-row .rb{flex:1; height:10px; background:#F6E9EE; border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.pd-row .rb>i{display:block; height:100%; background:linear-gradient(90deg,#F9C6D2,#F48CA4)}
.pd-row .rv{flex:0 0 70px; text-align:right; color:var(--dim); font-size:12px}
textarea{width:100%; min-height:84px; resize:vertical; border:1px solid var(--line); border-radius:14px; background:var(--card2); padding:12px; font-size:15px; font-family:inherit; color:var(--ink); line-height:1.6; -webkit-user-select:text; user-select:text}
textarea:focus{outline:2px solid var(--pinksoft)}
.btns{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
.btn{flex:1; min-width:120px; border:0; border-radius:16px; padding:14px 12px; font-size:15.5px; font-weight:800; cursor:pointer; min-height:50px}
.btn.primary{background:linear-gradient(135deg,#F8B7C6,#F48CA4); color:#fff; box-shadow:0 6px 16px rgba(244,140,164,.3)}
.btn.ghost{background:var(--card); border:1px solid var(--line); color:var(--ink)}
.btn.sm{min-width:0; padding:11px 12px; font-size:14px; flex:1}
.btn:active{transform:scale(.98)}
.foot{text-align:center; color:var(--dim); font-size:12.5px; font-weight:600; margin-top:18px; line-height:1.9}
#toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(14px);
  background:rgba(74,64,56,.94); color:#fff; font-size:14px; font-weight:700; padding:11px 18px; border-radius:14px;
  opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:88%; text-align:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* ===== iPad / 大屏适配 ===== */
@media (min-width:768px){
  body{font-size:19px}
  .rail{width:134px; flex-basis:134px; padding-left:12px; padding-right:12px; gap:8px}
  .rail .rlogo{font-size:30px}
  .rail button{min-height:76px; font-size:13px; border-radius:16px}
  .rail button .e{font-size:28px}
  .main{padding-left:22px; padding-right:22px}
  .inner{max-width:760px}
  h1{font-size:26px}
  h2{font-size:20px}
  .head{padding:20px; border-radius:24px}
  .head .date{font-size:16px}
  .ptxt{font-size:16px} .ptxt b{font-size:23px}
  .pill{padding:12px 8px} .pill b{font-size:24px} .pill span{font-size:13px}
  .pbar{height:16px}
  .task{min-height:66px; padding:14px 12px}
  .task .ck{width:38px;height:38px;font-size:22px;border-radius:12px}
  .task .nm{font-size:19px}
  .task .sub{font-size:14px}
  .rbtn{font-size:16px; padding:12px 16px; min-height:50px}
  .timecard .tline{font-size:17px} .nowline{font-size:14.5px}
  .btn{font-size:17px; min-height:56px}
  .petface{font-size:90px} .petname{font-size:20px}
  .grp{border-radius:22px}
  .lrow,.hrow{font-size:15px}
  .bnm{font-size:17px} .bt{font-size:14px} .bai{font-size:14.5px}
  .blk .task .nm{font-size:17px}
  .acts2 button{font-size:15px; padding:12px 10px}
}
@media (min-width:1024px){
  body{font-size:20px}
  .inner{max-width:880px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <div class="inner">
      <div class="head">
        <div class="hrowtop"><h1>🌷 婉欣的学习打卡</h1><button class="snd" id="sndBtn">🔔</button></div>
        <div class="date" id="dateLine">—</div>
        <div class="pbar"><i id="pbar"></i></div>
        <div class="ptxt"><span>今日完成进度</span><span><b id="pct">0%</b> · <span id="cnt">0/0</span></span></div>
        <div class="pills">
          <div class="pill"><b id="pPoints">0</b><span>总积分(累计)</span></div>
          <div class="pill"><b id="pBal">0</b><span>可用积分</span></div>
          <div class="pill"><b id="pToday">0</b><span>今日获得</span></div>
        </div>
        <div id="closedNote" style="display:none;margin-top:11px;font-size:13.5px;font-weight:800;color:#D5546E;background:#FDECEF;border-radius:12px;padding:9px 11px">⏰ 已过 20:40，今天不能再打卡了，早点休息～</div>
      </div>

      <div id="view"></div>

      <div class="btns">
        <button class="btn primary" id="btnDoneAll">🌟 一键全打勾</button>
        <button class="btn ghost" id="btnReset">♻️ 重置今日</button>
      </div>

      <div class="foot">
        数据只保存在这台设备的浏览器里，不会上传联网。
        <div id="verLine" style="margin-top:6px">婉欣学习打卡 v5</div>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   婉欣学习打卡工作台 v5 —— 左栏分类 + 日程时间轴 + localStorage
   ============================================================ */
const KEY = 'wxcheckin';
const PTS_PER = 5;
const BONUS_ALL = 10;
const COST = {feed:50, play:100, acc:150};
const PET_NAME = '团子';
const ACCESSORIES = ['🎀','🧣','👑','🌸'];
const LEVELS = [
  {min:0,   name:'宠物蛋',  emoji:'🥚'},
  {min:100, name:'幼崽',    emoji:'🐱'},
  {min:300, name:'成长中',  emoji:'😺'},
  {min:600, name:'成年宠物',emoji:'😻'}
];

const GROUPS = [
  {key:'yuwen', name:'语文', icon:'📖', tasks:[
    {id:'yw1', n:'每日写字',  pri:'next'},
    {id:'yw2', n:'每日控笔',  pri:'next'},
    {id:'yw3', n:'课后习题',  pri:'high'},
    {id:'yw4', n:'拼音练习',  read:'pinyin'},
    {id:'yw5', n:'亲子阅读'},
    {id:'yw6', n:'古诗背诵',  pri:'reduce', read:'poem'}
  ]},
  {key:'shuxue', name:'数学', icon:'➗', tasks:[
    {id:'sx1', n:'数字练习'},
    {id:'sx2', n:'每日口算',  pri:'next', read:'math'},
    {id:'sx3', n:'课后习题',  pri:'high'},
    {id:'sx4', n:'校信作业',  pri:'high'},
    {id:'sx5', n:'思维训练',  pri:'reduce'}
  ]},
  {key:'yingyu', name:'英语', icon:'🇬🇧', tasks:[
    {id:'yy1', n:'自然拼读',  read:'phonics'},
    {id:'yy2', n:'绘本阅读'},
    {id:'yy3', n:'字母书写',  pri:'next'}
  ]},
  {key:'gangqin', name:'钢琴', icon:'🎹', tasks:[
    {id:'gq1', n:'每日打卡'},
    {id:'gq2', n:'指法练习'},
    {id:'gq3', n:'曲谱练习',  pri:'reduce'}
  ]},
  {key:'yundong', name:'运动', icon:'🏃', tasks:[
    {id:'yd1', n:'运动训练'}
  ]},
  {key:'xisu', name:'习惯', icon:'🪥', tasks:[
    {id:'xg1', n:'晨起刷牙'},
    {id:'xg2', n:'晚间刷牙'},
    {id:'xg3', n:'20:30 准时结束学习'}
  ]}
];
const ALL_TASKS = GROUPS.reduce((a,g)=>a.concat(g.tasks), []);
const TOTAL = ALL_TASKS.length;
const PRI_LABEL = {high:'⭐最高', next:'✨次优', reduce:'🌿可减量'};

/* ---------- 日程（时间段） ---------- */
const SCHEDULE = [
  {s:'16:30', e:'17:00', icon:'🍪', title:'放学回家 · 点心放松', ai:'不碰学习，先休息。推送今日完整任务清单，预览今天要完成的事项。', preview:true},
  {s:'17:00', e:'17:25', icon:'📖', title:'语文 · 控笔 + 每日写字', tasks:['yw2','yw1'], ai:'展示笔画示范，计时 25 分钟；到点提醒休息。', voice:'stroke', timer:25},
  {s:'17:25', e:'17:35', icon:'🧘', title:'休息拉伸 · 离开书桌', ai:'站起来走动，远离屏幕。', rest:true, timer:10},
  {s:'17:35', e:'18:00', icon:'📖', title:'语文 · 拼音练习 + 课后习题', tasks:['yw4','yw3'], ai:'AI 朗读拼音、读题目；完成后手动打卡。', voice:'pinyin', timer:25},
  {s:'18:00', e:'18:30', icon:'🍚', title:'晚餐', ai:'暂停所有任务。', pause:true},
  {s:'18:30', e:'18:55', icon:'➗', title:'数学 · 口算 + 数字练习 + 课后习题 + 校信作业', tasks:['sx2','sx1','sx3','sx4'], ai:'AI 随机出口算题、读题目；优先完成学校作业。', voice:'math', timer:25},
  {s:'18:55', e:'19:05', icon:'🧘', title:'短暂休息', ai:'提醒休息。', rest:true, timer:10},

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function cnWeekday(d){ return '周'+'日一二三四五六'[d.getDay()]; }
function niceDate(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+cnWeekday(d); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t){ const w=$('toast'); w.textContent=t; w.classList.add('show');
  clearTimeout(w._t); w._t=setTimeout(()=>w.classList.remove('show'),1900); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function hm2min(s){ if(!s) return null; const p=String(s).split(':'); return (+p[0])*60+(+p[1]||0); }

let actx=null;
function ac(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended'&&actx.resume) actx.resume(); return actx; }
function playCoin(){ if(state && state.sound===false) return; try{
  const a=ac(); const t0=a.currentTime;
  [[987.77,0,0.09],[1318.51,0.085,0.38]].forEach(function(p){
    const o=a.createOscillator(), g=a.createGain();
    o.type='square'; o.frequency.value=p[0]; o.connect(g); g.connect(a.destination);
    const s=t0+p[1];
    g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.28,s+.012); g.gain.exponentialRampToValueAtTime(.0001,s+p[2]);
    o.start(s); o.stop(s+p[2]+.03);
  });
 }catch(e){} }
function metroClick(strong){ if(state && state.sound===false) return; try{
  const a=ac(); const o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.value= strong?1320:880; o.connect(g); g.connect(a.destination);
  const t=a.currentTime;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(strong?.32:.18,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o.start(t); o.stop(t+.08);
 }catch(e){} }

/* ---------- 状态 ---------- */
let state = null, cur = 'schedule', rfT=null, lastBlk=-2;
function defState(){
  return { v:5, today:todayStr(),
    done:{}, awarded:{}, allBonus:false, allDoneAt:'', todayEarned:0, sound:true,
    points:0, peak:0,
    pet:{ happiness:0, acc:'' },
    log:[], history:{}, reflect:'' };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) state = Object.assign(defState(), JSON.parse(raw)); }catch(e){}
  if(!state) state = defState();
  state.done = state.done||{}; state.awarded = state.awarded||{};
  state.log = state.log||[]; state.history = state.history||{};
  state.pet = Object.assign({happiness:0,acc:''}, state.pet||{});
  if(typeof state.points!=='number') state.points=0;
  if(typeof state.peak!=='number') state.peak=state.points||0;
  if(typeof state.allDoneAt!=='string') state.allDoneAt='';
  if(typeof state.sound!=='boolean') state.sound=true;
  rollover(); save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function rollover(){
  const t = todayStr();
  if(state.today !== t){
    const doneIds = Object.keys(state.done);
    if(doneIds.length || (state.reflect||'').trim()){
      state.history[state.today] = { done: doneIds, pct: Math.round(doneIds.length/TOTAL*100),
        earned: state.todayEarned||0, reflect: (state.reflect||'').trim(), allDoneAt: state.allDoneAt||'' };
    }
    state.today = t; state.done={}; state.awarded={};
    state.allBonus=false; state.allDoneAt=''; state.todayEarned=0; state.reflect='';
  }
}

/* ---------- 积分 ---------- */
function addLog(text, delta){
  const now = new Date();
  state.log.unshift({ text, delta, when: pad(now.getMonth()+1)+'/'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes()) });
  state.log = state.log.slice(0, 60);
}
function earn(n, why){ state.points += n; state.peak += n; state.todayEarned += n; addLog(why, +n); }
function spend(n, why){ if(state.points < n) return false; state.points -= n; addLog(why, -n); return true; }
function deduct(n, why){ state.points=Math.max(0,state.points-n); state.peak=Math.max(0,state.peak-n); state.todayEarned=Math.max(0,state.todayEarned-n); addLog(why,-n); }

/* ---------- 打卡 ---------- */
function checkinClosed(){ const d=new Date(); return (d.getHours()*60+d.getMinutes()) >= (20*60+40); }
function isDone(id){ return !!state.done[id]; }
function nameOf(id){ const t = ALL_TASKS.find(x=>x.id===id); return t?t.n:id; }
function toggleTask(id){
  if(checkinClosed()){ toast('⏰ 已过 20:40，今天不能再打卡了'); return; }
  if(state.done[id]){
    delete state.done[id];
    if(state.awarded[id]){ delete state.awarded[id];
      deduct(PTS_PER, '取消：'+nameOf(id)+' -'+PTS_PER);
      if(state.allBonus){ state.allBonus=false; deduct(BONUS_ALL,'取消全部完成 -'+BONUS_ALL); } }
    toast('已取消打卡 -'+PTS_PER+' 分');
  } else {
    state.done[id] = true; playCoin();
    if(!state.awarded[id]){ state.awarded[id]=true; earn(PTS_PER, '完成：'+nameOf(id)+' +'+PTS_PER); }
    const n = Object.keys(state.done).length;
    if(n >= TOTAL && !state.allBonus){ state.allBonus=true; state.allDoneAt=nowHM(); earn(BONUS_ALL, '今日全部完成，额外 +'+BONUS_ALL); toast('🎉 全部完成！额外 +'+BONUS_ALL+' 分'); }
  }
  save(); render();
}

let curSpeakKey = null;
function say(text, lang, key){
  if(!('speechSynthesis' in window)){ toast('此浏览器暂不支持语音朗读'); return; }
  if(curSpeakKey === key){ window.speechSynthesis.cancel(); curSpeakKey=null; setReadBtn(key,false); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'zh-CN'; u.rate = 0.9; u.pitch = 1.05;
  curSpeakKey = key; setReadBtn(key,true);
  u.onend = u.onerror = () => { if(curSpeakKey===key){ curSpeakKey=null; setReadBtn(key,false); } };
  try{ window.speechSynthesis.speak(u); }catch(e){ toast('朗读失败，请再点一次'); curSpeakKey=null; }
}

function numCn(n){
  const d=['零','一','二','三','四','五','六','七','八','九'];
  if(n<10) return d[n]; if(n<20) return '十'+(n%10?d[n%10]:''); if(n===20) return '二十'; return String(n);
}
function genMath(){
  const plus = Math.random()<0.55; let a,b,op;
  if(plus){ a=1+Math.floor(Math.random()*9); b=1+Math.floor(Math.random()*9); if(a+b>20) b=20-a; op='+'; }
  else{ a=5+Math.floor(Math.random()*16); b=1+Math.floor(Math.random()*9); if(b>a){const t=a;a=b;b=t;} op='−'; }
  return {a,b,op};
}

let bTimer = null, metro = null;
function blkTimerBtnText(i){
  if(bTimer && bTimer.i===i){ const l=bTimer.left; return '⏸ '+pad(Math.floor(l/60))+':'+pad(l%60); }
  const b=SCHEDULE[i];
  if(b.timer) return '▶ '+b.timer+' 分钟计时';
  const t=hm2min(b.e); return t!=null? ('▶ 不计时') : '▶ 不计时';
}
function startBlockTimer(i){
  if(checkinClosed() && SCHEDULE[i].end) {}
  if(bTimer && bTimer.i===i){ clearInterval(bTimer.iv); bTimer=null; renderView(); toast('已暂停计时'); return; }
  if(bTimer){ clearInterval(bTimer.iv); bTimer=null; }
  const mins = SCHEDULE[i].timer || Math.max(5, (hm2min(SCHEDULE[i].e)-hm2min(SCHEDULE[i].s)));
  bTimer={i, left: mins*60, iv:null};
  bTimer.iv=setInterval(()=>{ bTimer.left--; if(bTimer.left<=0){ const b=SCHEDULE[i]; clearInterval(bTimer.iv); bTimer=null; renderView();
      playCoin(); say('时间到，'+b.title+'结束啦，'+(b.rest?'继续休息一下':'休息一下或进入下一环节'), 'zh-CN','blkend'); toast('⏰ 该环节结束：'+b.title);
    } else { const el=document.getElementById('btm-'+i); if(el) el.textContent=blkTimerBtnText(i); } }, 1000);
  renderView(); toast('⏱️ 开始计时 '+mins+' 分钟');
}

  if(metro){ clearInterval(metro); metro=null; renderView(); toast('节拍器已停止'); return; }
  let beat=0; metro=setInterval(()=>{ metroClick(beat%4===0); beat++; }, 500); // 120 BPM

function curBlkIdx(){
  const now=new Date(); const t=now.getHours()*60+now.getMinutes();
  let idx=-1; for(let i=0;i<SCHEDULE.length;i++){ const m=hm2min(SCHEDULE[i].s); if(m!=null && t>=m) idx=i; }
  return idx;
}
function renderSchedule(){
  const now=new Date(), t=now.getHours()*60+now.getMinutes();
  const ci=curBlkIdx();
  let h='<h2>⏰ 今日日程 <span class="tip">'+nowHM()+' 当前</span></h2>';
  h+='<div class="sched-head"><div class="now">🕐 现在 <b>'+(ci>=0? SCHEDULE[ci].icon+' '+SCHEDULE[ci].title : '未开始')+'</b></div>'
    +'<div class="muted" style="margin-top:6px">时间紧可压缩「可减量」任务；20:30 收工，20:40 后不能再打卡。</div>'
    +'<div class="acts2" style="margin-top:10px"><button data-act="saylist">🔊 播报今日完整任务清单</button></div></div>';
  h+='<div class="grp" style="margin-top:10px">'+GROUPS.map(g=>'<div class="task" style="min-height:40px"><div class="mid"><div class="nm" style="font-size:14px">'+g.icon+' '+g.name+' · '+g.tasks.filter(x=>isDone(x.id)).length+'/'+g.tasks.length+'</div></div></div>').join('')+'</div>';

  SCHEDULE.forEach((b,i)=>{
    const cls = 'blk' + (i===ci?' cur':'') + ((hm2min(b.e)!=null && t>hm2min(b.e))?' past':'');
    const time = b.s ? (b.e? (b.s+' – '+b.e) : b.s) : '机动';
    h+='<div class="'+cls+'">';
    h+='<div class="bhd"><span class="bt">'+time+'</span><span class="nm" style="flex:1;min-width:120px">'+b.icon+' '+esc(b.title)+'</span></div>';
    h+='<div class="bai"><span class="ailab">💡 AI：</span>'+esc(b.ai)+'</div>';
    if(b.tasks && b.tasks.length){
      h+='<div class="tasks">'+b.tasks.map(id=>{ const tk=ALL_TASKS.find(x=>x.id===id); return tk?taskRow(tk):''; }).join('')+'</div>';
    }
    const hasTimer = !!b.timer;
    if(b.timer || b.voice || b.metro || b.tasks){
      h+='<div class="acts2">';
      if(b.voice || b.ai) h+='<button data-read="blk'+i+'" data-blkvoice="'+i+'">🔊 听提示</button>';
      if(hasTimer) h+='<button id="btm-'+i+'" data-blktm="'+i+'" class="'+(bTimer&&bTimer.i===i?'on':'')+'">'+blkTimerBtnText(i)+'</button>';
      if(b.metro) h+='<button data-metro="1" class="'+(metro?'on':'')+'">🎹 节拍器</button>';
      h+='</div>';
    }
    // 打卡状态
    if(b.tasks && b.tasks.length){
      const dn=b.tasks.filter(id=>isDone(id)).length, all=b.tasks.every(id=>isDone(id));
      h+='<div class="badd '+(all?'ok':'')+'">'+(all?'✅ 本环节已全部打卡':'本环节打卡 '+dn+'/'+b.tasks.length)+'</div>';
    }
    h+='</div>';
  });
  return h;
}

function renderPet(){
  const p=state.pet, L=levelOf(state.peak), N=nextLevel(state.peak);
  const acc = p.acc ? (' '+p.acc) : '';
  let h='<h2>🐱 我的宠物</h2><div class="card petcard">';
  h+='<div class="petface">'+L.emoji+acc+'</div><div class="petname">'+PET_NAME+'</div>';
  h+='<div class="petlv">当前等级：'+L.name+'</div>';
  h+='<div class="petstats"><div class="pstat"><b>'+state.peak+'</b><span>总积分</span></div><div class="pstat"><b>'+p.happiness+'</b><span>开心值</span></div><div class="pstat"><b>'+state.points+'</b><span>可用积分</span></div></div>';
  const hp=Math.max(0,Math.min(100,p.happiness));
  h+='<div class="happy">开心值 '+p.happiness+'<div class="bar"><i style="width:'+hp+'%"></i></div></div>';
  h+='<div class="acts"><button data-buy="feed">🍚 喂食<br><span class="c">'+COST.feed+' 分 · 开心+1</span></button><button data-buy="play">🎾 玩耍<br><span class="c">'+COST.play+' 分 · 开心+2</span></button><button data-buy="acc">🎀 买配饰<br><span class="c">'+COST.acc+' 分</span></button></div>';
  h+='<div class="next-lv">'+(N?('距离「'+N.name+'」还差 '+(N.min-state.peak)+' 总积分'):'已经是最高等级啦，太厉害了！')+'</div>';
  return h+'</div>';
}
function renderLog(){
  if(!state.log.length) return '<div class="card"><div class="muted">还没有积分记录～ 打卡就会出现在这里。</div></div>';
  return '<div class="card">'+state.log.slice(0,30).map(l=>{ const cls=l.delta>=0?'up':'dn', sign=l.delta>=0?'+':'';
    return '<div class="lrow"><span>'+esc(l.text)+'</span><span class="r"><span class="'+cls+'">'+sign+l.delta+'</span> · '+l.when+'</span></div>'; }).join('')+'</div>';
}
function renderHist(){
  const today=todayStr(); const rows=[]; const dn=Object.keys(state.done).length;
  if(dn || (state.reflect||'').trim()) rows.push({d:today, pct:Math.round(dn/TOTAL*100), n:dn, earned:state.todayEarned, rf:state.reflect, live:true});
  Object.keys(state.history).sort().reverse().forEach(k=>{ if(k===today) return; const it=state.history[k];
    rows.push({d:k, pct:it.pct||0, n:(it.done||[]).length, earned:it.earned||0, rf:it.reflect||'', live:false}); });
  if(!rows.length) return '<div class="card"><div class="muted">还没有历史记录～ 完成后会存档到这里。</div></div>';
  return '<div class="card">'+rows.slice(0,30).map(r=>'<div class="hrow"><div><b>'+r.d+(r.live?' · 今天':'')+'</b> · 完成 '+r.n+'/'+TOTAL+'（'+r.pct+'%）· '+r.earned+' 分</div>'+(r.rf?('<div class="rf">📝 '+esc(r.rf)+'</div>'):'')+'</div>').join('')+'</div>';
}
function renderSetup(){
  return '<h2>📝 今日复盘</h2><div class="card"><textarea id="reflect" placeholder="今天哪里做得好？哪里可以更快一点？（自动保存）"></textarea></div>'
    + '<h2>💾 数据备份</h2><div class="card"><div class="muted" style="margin-bottom:8px">数据存在本机浏览器里，换设备或清理缓存前先导出备份。</div>'
    + '<div class="row" style="display:flex;gap:9px"><button class="btn ghost sm" data-act="export">⬇️ 导出备份</button><button class="btn ghost sm" data-act="import">⬆️ 导入备份</button></div>'
    + '<input type="file" id="fileImport" accept="application/json,.json" style="display:none"></div>'
    + '<h2>🔔 音效</h2><div class="card"><div class="muted">打卡/节拍器音效。点顶部圆按钮切换。</div></div>';
}
function dayKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekDays(){ const d=new Date(); const off=(d.getDay()+6)%7; const s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off);
  const arr=[]; for(let i=0;i<7;i++){ arr.push(dayKey(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i))); } return arr; }
function onTimeHM(hhmm){ if(!hhmm) return false; const p=String(hhmm).split(':'); return (+p[0]*60 + (+p[1]||0)) <= (20*60+30); }
function dayRecord(k){
  if(k===todayStr()){ const dn=Object.keys(state.done).length; return {done:Object.keys(state.done), pct:Math.round(dn/TOTAL*100), earned:state.todayEarned||0, rf:state.reflect||'', allDoneAt:state.allDoneAt||'', live:true}; }
  const it=state.history[k]; if(!it) return null;
  return {done:it.done||[], pct:it.pct||0, earned:it.earned||0, rf:it.reflect||'', allDoneAt:it.allDoneAt||''};
}
function fullStreak(){
  let start=new Date(); const r=dayRecord(dayKey(start));
  if(!(r && r.pct===100)) start=new Date(start.getFullYear(),start.getMonth(),start.getDate()-1);
  let cnt=0;
  for(let i=0;i<400;i++){ const rr=dayRecord(dayKey(new Date(start.getFullYear(),start.getMonth(),start.getDate()-i))); if(rr && rr.pct===100) cnt++; else break; }
  return cnt;
}
function renderParent(){
  const days=weekDays(); const wd=['一','二','三','四','五','六','日'], today=todayStr();
  const recs=days.map(k=>({k, r:dayRecord(k)}));
  const act=recs.filter(x=>x.r && (x.r.done.length || (x.r.rf||'').trim()));
  const actDays=act.length, avg=actDays?Math.round(act.reduce((a,x)=>a+x.r.pct,0)/actDays):0;
  const earn=recs.reduce((a,x)=>a+(x.r?x.r.earned:0),0);
  const onTimeDays=recs.filter(x=>x.r && x.r.pct===100 && onTimeHM(x.r.allDoneAt)).length;
  const fullDays=recs.filter(x=>x.r && x.r.pct===100).length;
  let h='<div class="card"><div class="sum">'
    + '<div class="b"><b>'+actDays+'/7</b><span>本周打卡天数</span></div><div class="b"><b>'+avg+'%</b><span>平均完成率</span></div><div class="b"><b>'+earn+'</b><span>本周获得积分</span></div></div>'
    + '<div class="sum"><div class="b"><b>'+onTimeDays+'</b><span>20:30 前完成</span></div><div class="b"><b>'+fullDays+'</b><span>全勤(100%)</span></div><div class="b"><b>'+fullStreak()+'</b><span>连续全勤(天)</span></div></div>';
  h+='<div style="font-weight:800;font-size:14px;margin:10px 2px 4px">各科本周完成率</div>';
  GROUPS.forEach(g=>{ let done=0; recs.forEach(x=>{ if(x.r) g.tasks.forEach(t=>{ if(x.r.done.indexOf(t.id)>=0) done++; }); });
    const tot=g.tasks.length*actDays, pct=tot?Math.round(done/tot*100):0;
    h+='<div class="pd-row"><span class="rd">'+g.icon+' '+g.name+'</span><span class="rb"><i style="width:'+pct+'%"></i></span><span class="rv">'+(tot?(done+'/'+tot):'—')+'</span></div>'; });
  h+='<div style="font-weight:800;font-size:14px;margin:12px 2px 4px">每日明细</div>';
  recs.forEach((x,i)=>{ if(!x.r){ h+='<div class="hrow"><b>'+x.k+' 周'+wd[i]+'</b> · 未打卡</div>'; return; }
    const on=x.r.pct===100 && onTimeHM(x.r.allDoneAt); let tag=(x.k===today)?' · 今天':'';
    if(x.r.pct===100) tag += on ? ' · ✅按时' : (x.r.allDoneAt?(' · 完成于 '+x.r.allDoneAt):'');
    h+='<div class="hrow"><div><b>'+x.k+' 周'+wd[i]+'</b> · 完成 '+x.r.done.length+'/'+TOTAL+'（'+x.r.pct+'%）· '+x.r.earned+' 分'+tag+'</div>'+(x.r.rf?('<div class="rf">📝 '+esc(x.r.rf)+'</div>'):'')+'</div>'; });
  return h+'</div>';
}
function renderTime(now){
  const t=now.getHours()*60+now.getMinutes();
  const m=[16*60+30, 20*60+20, 20*60+30, 20*60+40];
  let active=-1, label='';
  if(t<m[0]){ active=-1; label='还没到开始时间，先休息一下～'; }
  else if(t<m[1]){ active=0; label='任务进行中，加油！'; }
  else if(t<m[2]){ active=1; label='收工预警，还剩 10 分钟！'; }
  else if(t<m[3]){ active=2; label='已过 20:30，停止做题，准备收尾～'; }
  else { active=3; label='已过 20:40，今天停止打卡啦，早点休息～'; }
  const nl=$('nowLine'); if(nl) nl.textContent='🕐 现在 '+pad(now.getHours())+':'+pad(now.getMinutes())+' · '+label;
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ goTab(tab.dataset.tab); return; }
  const ck=e.target.closest('[data-ck]');   if(ck){ toggleTask(ck.dataset.ck); return; }
  const sb=e.target.closest('[data-say]');  if(sb){ doRead(sb.dataset.kind); return; }
  const bv=e.target.closest('[data-blkvoice]'); if(bv){ blkRead(+bv.dataset.blkvoice); return; }
  const bt=e.target.closest('[data-blktm]'); if(bt){ startBlockTimer(+bt.dataset.blktm); return; }
  if(e.target.closest('[data-metro]')){ toggleMetro(); return; }
  const buy=e.target.closest('[data-buy]'); if(buy){ petBuy(buy.dataset.buy); return; }
  const act=e.target.closest('[data-act]');
  if(act){ const a=act.dataset.act;
    if(a==='export') exportData();
    else if(a==='import'){ const fi=$('fileImport'); if(fi) fi.click(); }
    else if(a==='saylist') sayTodayList();
    return; }
});
document.addEventListener('input', e=>{ if(e.target && e.target.id==='reflect'){ clearTimeout(rfT); rfT=setTimeout(()=>{ state.reflect=e.target.value; save(); },400); } });
document.addEventListener('change', e=>{ if(e.target && e.target.id==='fileImport') importFile(e.target); });

$('btnDoneAll').addEventListener('click', ()=>{
  if(checkinClosed()){ toast('⏰ 已过 20:40，今天不能再打卡了'); return; }
  playCoin(); let added=0;
  ALL_TASKS.forEach(t=>{ if(!state.done[t.id]){ state.done[t.id]=true; if(!state.awarded[t.id]){state.awarded[t.id]=true; earn(PTS_PER,'完成：'+t.n+' +'+PTS_PER); added++;} } });
  if(!state.allBonus && Object.keys(state.done).length>=TOTAL){ state.allBonus=true; state.allDoneAt=nowHM(); earn(BONUS_ALL,'今日全部完成，额外 +'+BONUS_ALL); }
  save(); render(); toast('一键完成，+'+(added*PTS_PER+(state.allBonus?BONUS_ALL:0))+' 分');
});
$('btnReset').addEventListener('click', ()=>{
  if(!confirm('确定清空【今天】的打卡吗？（历史记录、总积分、宠物状态都会保留）')) return;
  state.done={}; state.awarded={}; state.allBonus=false; state.allDoneAt=''; state.todayEarned=0; state.reflect='';
  save(); render(); toast('已重置今日打卡（积分和宠物保留）');
});
$('sndBtn').addEventListener('click', ()=>{ state.sound=!state.sound; save(); updateSndBtn(); if(state.sound) playCoin(); toast(state.sound?'🔔 音效已开启':'🔕 音效已关闭'); });

function exportData(){ try{ const blob=new Blob([JSON.stringify(state)],{type:'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='婉欣打卡备份_'+todayStr()+'.json'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400); toast('已导出备份'); }catch(e){ toast('导出失败'); } }
function importFile(input){ const f=input.files&&input.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); state=Object.assign(defState(), d);
    state.done=state.done||{}; state.awarded=state.awarded||{}; state.log=state.log||[]; state.history=state.history||{};
    state.pet=Object.assign({happiness:0,acc:''}, state.pet||{}); rollover(); save(); render(); toast('✅ 备份已恢复');
  }catch(e){ toast('文件格式不对'); } };
  rd.readAsText(f); }

setInterval(()=>{
  renderTime(new Date());
  if(cur==='schedule'){ const i=curBlkIdx(); if(i!==lastBlk){ lastBlk=i; renderView(); if(i>=0) toast('⏰ 进入：'+SCHEDULE[i].icon+' '+SCHEDULE[i].title); } }
}, 20000);

/* ---------- 启动 ---------- */
load(); render(); lastBlk=curBlkIdx();
</script>
</body>
